[workspace]
resolver = "2"
members = [
    "crates/leviathan-core",
    "crates/leviathan-dsp",
    "crates/leviathan-gpu",
    "crates/leviathan-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/JosiahAlanLee/Leviathan"

[workspace.dependencies]
leviathan-core = { path = "crates/leviathan-core", default-features = false }
leviathan-dsp = { path = "crates/leviathan-dsp", default-features = false }
leviathan-gpu = { path = "crates/leviathan-gpu" }
bytemuck = { version = "1.19", features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
rtrb = "0.3"
cpal = "0.17"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
