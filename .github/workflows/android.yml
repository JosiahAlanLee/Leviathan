name: Android preview

on:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/leviathan-app/Cargo.toml'
      - 'docs/ANDROID_PREVIEW.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - name: Install Android SDK tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build ARM64 debug APK
        run: cargo apk build -p leviathan-app --lib
      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-android-arm64-debug
          path: target/debug/apk/leviathan-app.apk
          if-no-files-found: error
