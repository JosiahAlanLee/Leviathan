[package]
name = "leviathan-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-binary Rust A/V tracker workstation (Score v3 + DSP + wgpu + egui)"

[dependencies]
cpal = { workspace = true }
eframe = { workspace = true }
leviathan-core = { workspace = true, features = ["std", "serde"] }
leviathan-dsp = { workspace = true, features = ["std"] }
leviathan-gpu = { workspace = true }
midir = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity", "glow"] }
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
log = "0.4"
jni = "0.22.4"

[package.metadata.android]
package = "io.github.josiahalanlee.leviathan.portrait"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "Leviathan Portrait"
has_code = true
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "sensorPortrait"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
name = "io.github.josiahalanlee.leviathan.DocumentActivity"
