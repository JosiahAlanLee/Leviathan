[package]
name = "leviathan-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-binary Rust A/V tracker workstation (Score v3 + DSP + wgpu + egui)"

[dependencies]
cpal = { workspace = true }
eframe = { workspace = true }
leviathan-core = { workspace = true, features = ["std", "serde"] }
leviathan-dsp = { workspace = true, features = ["std"] }
leviathan-gpu = { workspace = true }
midir = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity"] }
winit = { version = "0.30", default-features = false }

[package.metadata.android]
package = "io.github.josiahalanlee.leviathan"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "Leviathan"

[package.metadata.android.application.activity]
orientation = "landscape"
